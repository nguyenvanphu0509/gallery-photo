services:
  seaweedfs:
    image: chrislusf/seaweedfs:4.54
    command: mini -dir=/data -ip=seaweedfs -ip.bind=0.0.0.0
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-gallery-local}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-gallery-local-secret}
      S3_BUCKET: ${S3_BUCKET:-moments}
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - seaweed-data:/data
    restart: unless-stopped

volumes:
  seaweed-data:
